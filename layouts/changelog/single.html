{{ define "main" }}
<article class="article wrap narrow">
  <a class="text-link" href="{{ "/changelog/" | strings.TrimPrefix "/" | relURL }}">← 全部版本记录</a>
  <div class="article-heading"><p class="eyebrow">RELEASE NOTES · <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "2006.01.02" }}</time></p><h1>{{ .Params.version | default .Title }}</h1><p>{{ .Params.summary }}</p></div>
  <div class="prose">{{ .Content }}</div>
  <a class="btn article-cta" href="{{ "/download/" | strings.TrimPrefix "/" | relURL }}">查看当前安装方式 <span aria-hidden="true">↗</span></a>
  <nav class="version-nav" aria-label="相邻版本">{{ with .PrevInSection }}<a href="{{ .RelPermalink }}">← {{ .Title }}</a>{{ end }}{{ with .NextInSection }}<a href="{{ .RelPermalink }}">{{ .Title }} →</a>{{ end }}</nav>
</article>
{{ end }}
