<header class="site-header">
  <div class="wrap nav-wrap">
    <a class="brand" href="{{ "/" | strings.TrimPrefix "/" | relURL }}" aria-label="Whiplash Master 首页">
      <img src="{{ "img/logo.png" | strings.TrimPrefix "/" | relURL }}" width="54" height="54" alt="">
      <span class="brand-name">Whiplash <span>Master</span></span>
    </a>
    <nav class="nav-links" aria-label="主导航">
      {{ $page := . }}
      {{ range site.Menus.main }}
        {{ $active := or (and (eq .Identifier "home") $page.IsHome) (eq .Identifier $page.Section) }}
        <a href="{{ .URL }}"{{ if $active }} class="active" aria-current="page"{{ end }}>{{ .Name }}</a>
      {{ end }}
    </nav>
    <div class="nav-end"><a class="btn" href="{{ "/download/" | strings.TrimPrefix "/" | relURL }}"{{ if eq .Section "download" }} aria-current="page"{{ end }}>下载 App</a></div>
  </div>
</header>
