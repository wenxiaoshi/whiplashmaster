{{ define "main" }}
<section class="article wrap narrow">
  <div class="article-heading"><h1>{{ .Title }}</h1>{{ with .Description }}<p>{{ . }}</p>{{ end }}</div>
  <div class="prose">{{ .Content }}</div>
  {{ with .Pages }}<nav class="related-pages" aria-label="相关页面">{{ range . }}<a href="{{ .RelPermalink }}">{{ .Title }} <span aria-hidden="true">↗</span></a>{{ end }}</nav>{{ end }}
</section>
{{ end }}
