{{ define "main" }}
<article class="article wrap narrow">
  <a class="text-link" href="{{ .Parent.RelPermalink }}">← {{ .Parent.Title }}</a>
  <div class="article-heading"><h1>{{ .Title }}</h1>{{ with .Description }}<p>{{ . }}</p>{{ end }}</div>
  <div class="prose">{{ .Content }}</div>
</article>
{{ end }}
